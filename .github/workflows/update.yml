name: Update and Check Configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install requests psutil retrying PyYaml

      - name: Set execute permissions for binaries
        run: |
          chmod +x xray/xray
          chmod +x hy2/hysteria

      # ШАГ 1: Сборка конфигов (merge.py)
      - name: Run merge script
        run: python scripts/merge.py || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ШАГ 2: Проверка и создание Happ-ссылки (cl.py)
      - name: Run checker script
        run: python scripts/cl.py

      # ШАГ 3: Сохранение итоговых файлов
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Добавляем только итоговые файлы
          git add output/merged.txt || true
          git add output/happ_link.txt || true
          
          if ! git diff --staged --quiet; then
            echo "Changes detected. Committing..."
            git commit -m "chore: Auto-update configs and happ link [skip ci]"
            
            echo "Pulling remote changes with autostash..."
            git pull --rebase --autostash origin main
            
            echo "Pushing..."
            git push origin main
          else
            echo "No changes to commit."
          fi