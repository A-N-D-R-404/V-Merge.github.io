name: Update merged configs

on:
  schedule:
    - cron: '* * * * *'   # ⚠️ ВРЕМЕННО: каждую минуту, только для проверки!
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-merged
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make binaries executable
        run: |
          chmod +x xray/xray || true
          chmod +x hy2/hysteria || true

      - name: Set timezone to Moscow
        run: sudo timedatectl set-timezone Europe/Moscow

      - name: Run merge script
        run: python scripts/merge.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/merged.txt \
                  output/merged.base64.txt \
                  output/happ_link.txt \
                  scripts/geo_cache.json \
                  scripts/sources_state.json \
                  scripts/dead_cache.json

          git diff --staged --quiet || git commit -m "auto: update configs + geo cache + state + dead cache + happ link [skip ci]"
          git push

      - name: Trigger Bot Broadcast
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/A-N-D-R-404/V-Merge-Bot/dispatches \
            -d '{"event_type": "configs_updated"}'
