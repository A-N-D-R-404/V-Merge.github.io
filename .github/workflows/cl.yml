name: Merge and Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install requests psutil retrying PyYaml

      # Если бинарники лежат в корне (xray/xray), этот шаг сработает
      - name: Set execute permissions for binaries
        run: |
          chmod +x xray/xray
          chmod +x hy2/hysteria

      # ШАГ 1: Запуск сборщика (работает из папки scripts)
      - name: Run merge script
        run: python scripts/merge.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ШАГ 2: Запуск проверки (путь указывает на папку scripts)
      - name: Run checker script
        run: python scripts/cl.py

      # ШАГ 3: Сохранение результатов
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add output/
          
          if ! git diff --staged --quiet; then
            echo "Changes detected. Committing and pushing..."
            git commit -m "chore: Auto-merge and check results [skip ci]"
            git push --force
          else
            echo "No changes to commit."
          fi