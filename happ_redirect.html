<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход в Happ...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0d1117; color: #c9d1d9;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; margin: 0; text-align: center;
        }
        .loader {
            border: 4px solid #30363d; border-top: 4px solid #58a6ff;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin: 0 0 10px 0; font-weight: 500; }
        p { color: #8b949e; font-size: 14px; }
        a { color: #58a6ff; text-decoration: none; margin-top: 20px; display: block; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Открываем Happ...</h2>
    <p>Если приложение не открылось, нажмите кнопку ниже.</p>
    
    <a id="fallback-link" href="#">Открыть вручную</a>

    <script>
        // Берем ссылку happ://crypt5/... из адресной строки (?url=...)
        const urlParams = new URLSearchParams(window.location.search);
        const happLink = urlParams.get('url');

        if (happLink) {
            // Устанавливаем ссылку для ручного нажатия
            document.getElementById('fallback-link').href = happLink;
            
            // Пытаемся автоматически открыть Happ
            window.location.href = happLink;
        } else {
            document.querySelector('h2').innerText = "Ошибка: ссылка не найдена.";
        }
    </script>
</body>
</html>
