<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход в Happ...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0d1117; color: #c9d1d9;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; margin: 0; text-align: center;
        }
        .loader {
            border: 4px solid #30363d; border-top: 4px solid #58a6ff;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin: 0 0 10px 0; font-weight: 500; }
        p { color: #8b949e; font-size: 14px; }
        a { color: #58a6ff; text-decoration: none; margin-top: 20px; display: block; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Открываем Happ...</h2>
    <p>Если приложение не открылось, нажмите кнопку ниже.</p>

    <a id="fallback-link" href="#" style="display:none;">Открыть вручную</a>

    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            let rawUrl = urlParams.get('url');
            const titleEl = document.querySelector('h2');
            const descEl = document.querySelector('p');

            if (!rawUrl) {
                titleEl.innerText = "Ошибка: ссылка не найдена.";
                descEl.innerText = "";
                return;
            }

            let happLink = rawUrl;

            // Если передали JSON (из happ_link.txt), извлекаем ссылку
            if (rawUrl.trim().startsWith('{')) {
                try {
                    const data = JSON.parse(rawUrl);
                    happLink = data.encrypted_link || data.link || "";
                } catch (e) {
                    console.error("Ошибка парсинга JSON из URL", e);
                }
            }

            // Декодируем на случай, если ссылка была закодирована
            try {
                happLink = decodeURIComponent(happLink);
            } catch (e) {}

            // Если протокол happ:// потерялся при передаче
            if (happLink.startsWith("crypt")) {
                happLink = "happ://" + happLink;
            }

            // Проверка, что это действительно happ-ссылка
            if (!happLink || !happLink.startsWith("happ://")) {
                titleEl.innerText = "Ошибка: недопустимая ссылка.";
                descEl.innerText = "Не удалось извлечь happ-ссылку.";
                return;
            }

            const fallback = document.getElementById('fallback-link');
            fallback.href = happLink;
            fallback.style.display = 'block';

            // Пытаемся автоматически открыть Happ
            try {
                window.location.href = happLink;
            } catch (e) {
                console.warn("Не удалось автоматически открыть Happ:", e);
            }
        })();
    </script>
</body>
</html>
